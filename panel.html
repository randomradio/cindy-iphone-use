<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
:root{font:14px -apple-system,BlinkMacSystemFont,system-ui;color:var(--text-primary,#171717);background:var(--panel-bg,#f7f7f5)}*{box-sizing:border-box}body{margin:0}main{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--panel-bg,#f7f7f5)}.status{flex:none;border:1px solid var(--border-default,#ddd);background:var(--surface,#fff);padding:7px 12px;border-radius:24px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage{min-height:0;flex:1;width:100%;display:flex;align-items:center;justify-content:center}.device{position:relative;height:100%;aspect-ratio:440 / 956;max-width:100%;max-height:100%;border:7px solid #292b30;border-radius:36px;background:#090b10;box-shadow:0 7px 28px #0004;overflow:hidden}.device img{width:100%;height:100%;object-fit:contain;display:block}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#dadde2;text-align:center;padding:25px}.toolbar{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:center}.toolbar button{border:1px solid var(--border-default,#ddd);border-radius:20px;padding:9px 13px;color:inherit;background:var(--surface,#fff);font:inherit;cursor:pointer}.toolbar button:disabled{opacity:.4}#error{min-height:20px;max-height:3em;overflow:auto;color:#bc332b;text-align:center}body[data-paused="true"] img{display:none}[hidden]{display:none!important}
</style></head><body><main><div class="status" id="status" role="status">iPhone · Connecting</div><div class="stage"><div class="device" id="device"><img id="image" alt="Live phone screen" hidden><div class="empty" id="empty">Connecting…</div></div></div><div class="toolbar"><button id="refresh" type="button">Refresh</button><button id="home" type="button">Home</button><button id="screenshot" type="button">Screenshot</button><button id="pause" type="button">Pause</button></div><div id="error" role="alert"></div></main><script src="panel.js"></script></body></html>
